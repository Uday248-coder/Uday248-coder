# Put at .github/workflows/ignite.yml in your profile repo (<user>/<user>).
# Regenerates the SVGs and commits them to main, so the README always points at
# a real file and renders on the first push. Commits are skipped when nothing changed.
name: ignite-graph
on:
  schedule: [{ cron: "0 */12 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - generate.mjs
      - .github/workflows/ignite.yml
permissions:
  contents: write
concurrency:
  group: ignite-graph
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node generate.mjs --user "${{ github.repository_owner }}" --out output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ignite-dark.svg output/ignite-light.svg
          if git diff --cached --quiet; then
            echo "No graph changes - nothing to publish."
            exit 0
          fi
          git commit -m "chore: refresh contribution graph [skip ci]"
          git pull --rebase --autostash origin main
          git push
